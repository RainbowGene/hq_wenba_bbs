<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>帖子详情 - 问吧</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <style>
      /* 取消全局链接下划线 */
      a,
      a:hover,
      a:visited,
      a:active {
        text-decoration: none;
      }
      /* 回复内容样式 */
      .reply-content {
        font-size: 1.2rem; /* 比默认略大 */
        margin: 8px 0; /* 上下间距 */
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container"><a class="navbar-brand" href="/">问吧</a></div>
    </nav>
    <div class="container mt-3">
      <h3 id="postTitle"></h3>
      <p class="text-muted">
        发帖人：<span id="postAuthor"></span> | 分类：<span
          id="postCategory"
        ></span>
        | 悬赏：<span id="postBounty"></span> 积分
      </p>
      <button id="favoriteBtn" class="btn btn-sm mb-2" style="display: none">
        收藏
      </button>
      <hr />
      <div id="postContent"></div>
      <hr />
      <h4>回复列表</h4>
      <div id="repliesContainer"></div>
      <div id="replyBox" style="display: none" class="mt-4">
        <textarea
          id="replyContent"
          class="form-control"
          rows="3"
          placeholder="输入你的回答..."
        ></textarea>
        <button class="btn btn-primary mt-2" id="submitReply">提交回复</button>
      </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/modal-alert.js"></script>
    <script src="/js/common.js"></script>
    <script>
      function unescapeHtml(text) {
        if (!text) return "";
        return text
          .replace(/&amp;/g, "&")
          .replace(/&lt;/g, "<")
          .replace(/&gt;/g, ">")
          .replace(/&quot;/g, '"')
          .replace(/&#039;/g, "'");
      }

      const urlParams = new URLSearchParams(window.location.search);
      const postId = urlParams.get("id");
      if (!postId) window.location.href = "/";

      function getCurrentUserId() {
        const user = JSON.parse(localStorage.getItem("user") || "{}");
        return user.id || null;
      }

      let isFavorited = false;

      function updateFavoriteButton() {
        const btn = document.getElementById("favoriteBtn");
        if (!getToken()) {
          btn.style.display = "none";
          return;
        }
        btn.style.display = "inline-block";
        btn.textContent = isFavorited ? "⭐ 取消收藏" : "☆ 收藏";
        btn.className = `btn btn-sm mb-2 ${isFavorited ? "btn-warning" : "btn-outline-warning"}`;
      }

      async function toggleFavorite() {
        if (!postId) return;
        const res = await api(`/api/posts/${postId}/favorite`, {
          method: "POST",
        });
        if (res.code === 200) {
          isFavorited = res.data.isFavorited;
          updateFavoriteButton();
          ModalAlert.success(isFavorited ? "已收藏" : "已取消收藏");
        } else {
          ModalAlert.error(res.msg || "操作失败");
        }
      }

      async function loadReplies() {
        const res = await api(`/api/posts/${postId}`);
        if (res.code !== 200) return;
        const currentUserId = getCurrentUserId();
        const replies = res.data.replies;
        const repliesHtml = replies
          .map((r) => {
            const isOwnUnaudited =
              r.user_id === currentUserId && r.is_approved_by_owner === 0;
            let statusBadge = "";
            let deleteBtn = "";
            if (r.is_best) {
              statusBadge = '<span class="badge bg-success">最佳答案</span> ';
            } else if (isOwnUnaudited) {
              statusBadge =
                '<span class="badge bg-warning">等待贴主审核</span> ';
              deleteBtn = `<button class="btn btn-sm btn-outline-danger" onclick="deleteOwnReply(${r.id})">删除</button>`;
            }
            return `<div class="card mb-2">
          <div class="card-body">
            <div class="d-flex align-items-center">
              <strong><a href="/user-profile.html?id=${r.user_id}" target="_blank">${r.nickname}</a></strong>
              <span class="ms-2">${statusBadge}</span>
            </div>
            <div class="reply-content">${unescapeHtml(r.content)}</div>
            <div class="d-flex justify-content-between align-items-center">
              <small class="text-muted">${new Date(r.created_at).toLocaleString()}</small>
              ${deleteBtn}
            </div>
          </div>
        </div>`;
          })
          .join("");
        document.getElementById("repliesContainer").innerHTML =
          repliesHtml || "<p>暂无回复</p>";
      }

      window.deleteOwnReply = async (replyId) => {
        const confirmed = await ModalAlert.confirm(
          "确认删除",
          "确定要删除自己的回复吗？",
        );
        if (!confirmed) return;
        const res = await api(`/api/posts/${postId}/replies/${replyId}`, {
          method: "DELETE",
        });
        if (res.code === 200) {
          ModalAlert.success("回复已删除");
          loadReplies();
        } else ModalAlert.error(res.msg);
      };

      (async function loadPost() {
        const res = await api(`/api/posts/${postId}`);
        if (res.code !== 200) {
          ModalAlert.error("帖子不存在");
          return;
        }
        const post = res.data.post;
        document.getElementById("postTitle").innerText = post.title;
        document.getElementById("postAuthor").innerHTML =
          `<a href="/user-profile.html?id=${post.user_id}" target="_blank">${post.nickname}</a>`;
        document.getElementById("postCategory").innerText = post.category_name;
        document.getElementById("postBounty").innerText = post.bounty;
        document.getElementById("postContent").innerHTML = unescapeHtml(
          post.content,
        );

        if (getToken()) {
          const favRes = await api(`/api/posts/${postId}/favorite-status`);
          if (favRes.code === 200) {
            isFavorited = favRes.data.isFavorited;
            updateFavoriteButton();
          }
          document
            .getElementById("favoriteBtn")
            .addEventListener("click", toggleFavorite);
        }

        await loadReplies();

        if (getToken()) {
          document.getElementById("replyBox").style.display = "block";
          document
            .getElementById("submitReply")
            .addEventListener("click", async () => {
              const content = document
                .getElementById("replyContent")
                .value.trim();
              if (!content) {
                ModalAlert.error("回复内容不能为空");
                return;
              }
              const res = await api(`/api/posts/${postId}/reply`, {
                method: "POST",
                body: JSON.stringify({ content }),
              });
              if (res.code === 200) {
                ModalAlert.success("回复成功，等待贴主审核");
                document.getElementById("replyContent").value = "";
                await loadReplies();
              } else ModalAlert.error(res.msg);
            });
        }
      })();
    </script>
  </body>
</html>
