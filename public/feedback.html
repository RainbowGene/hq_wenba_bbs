<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>用户反馈 - 问吧</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="/">问吧</a>
        <div class="d-flex" id="auth-buttons">
          <!-- 根据登录状态动态显示 -->
        </div>
      </div>
    </nav>
    <div class="container mt-4">
      <h3>提交反馈</h3>
      <p>向我们反馈您遇到的问题或建议：</p>
      <div id="loginAlert" class="alert alert-warning" style="display: none">
        请先<a href="/login.html">登录</a>后再提交反馈。
      </div>
      <form id="feedbackForm" style="display: none">
        <div class="mb-3">
          <textarea
            class="form-control"
            id="feedbackContent"
            rows="6"
            placeholder="请详细描述..."
            required
          ></textarea>
        </div>
        <button type="submit" class="btn btn-primary">提交反馈</button>
      </form>
      <hr />
      <h5>我的反馈记录</h5>
      <table class="table" id="myFeedbacksTable">
        <thead>
          <tr>
            <th>内容</th>
            <th>管理员回复</th>
            <th>提交时间</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script>
      // 检查登录
      const token = getToken();
      if (token) {
        document.getElementById("loginAlert").style.display = "none";
        document.getElementById("feedbackForm").style.display = "block";
        // document.getElementById("auth-buttons").innerHTML =
        //   '<a href="/user-center.html" class="btn btn-outline-light me-2">个人中心</a><button class="btn btn-light" onclick="logout()">退出</button>';
        loadMyFeedbacks();
      } else {
        document.getElementById("loginAlert").style.display = "block";
        document.getElementById("feedbackForm").style.display = "none";
        document.getElementById("auth-buttons").innerHTML =
          '<a href="/login.html" class="btn btn-outline-light me-2">登录</a><a href="/register.html" class="btn btn-light">注册</a>';
      }

      // 提交反馈
      document
        .getElementById("feedbackForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const content = document
            .getElementById("feedbackContent")
            .value.trim();
          if (!content) return alert("请输入内容");
          const res = await api("/api/user/feedback", {
            method: "POST",
            body: JSON.stringify({ content }),
          });
          if (res.code === 200) {
            alert("反馈已提交");
            document.getElementById("feedbackContent").value = "";
            loadMyFeedbacks();
          } else alert(res.msg);
        });

      // 加载我的反馈
      async function loadMyFeedbacks() {
        const res = await api("/api/user/feedbacks");
        if (res.code === 200) {
          const tbody = document.querySelector("#myFeedbacksTable tbody");
          tbody.innerHTML =
            res.data
              .map(
                (f) => `
      <tr>
        <td>${f.content}</td>
        <td>${f.reply || '<span class="text-muted">待回复</span>'}</td>
        <td>${new Date(f.created_at).toLocaleString()}</td>
      </tr>
    `,
              )
              .join("") ||
            '<tr><td colspan="3" class="text-center">暂无反馈</td></tr>';
        }
      }
    </script>
  </body>
</html>
