<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>个人中心 - 问吧</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/modal-alert.js"></script>
    <script src="/js/common.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="/">问吧</a>
        <div class="ms-auto">
          <a href="/" class="btn btn-outline-light">返回首页</a>
        </div>
      </div>
    </nav>
    <div class="container mt-3">
      <!-- 选项卡部分保持不变 -->
      <ul class="nav nav-tabs" id="userTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            data-bs-toggle="tab"
            data-bs-target="#myQuestions"
            type="button"
          >
            我的提问
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            data-bs-toggle="tab"
            data-bs-target="#myReplies"
            type="button"
          >
            参与回答
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            data-bs-toggle="tab"
            data-bs-target="#messages"
            type="button"
          >
            站内留言
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            data-bs-toggle="tab"
            data-bs-target="#profile"
            type="button"
          >
            个人资料
          </button>
        </li>
      </ul>
      <div class="tab-content mt-3">
        <div class="tab-pane fade show active" id="myQuestions">
          <table class="table">
            <thead>
              <tr>
                <th>标题</th>
                <th>悬赏</th>
                <th>时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="questionTableBody"></tbody>
          </table>
        </div>
        <div class="tab-pane fade" id="myReplies">
          <table class="table">
            <thead>
              <tr>
                <th>回复内容</th>
                <th>对应帖子</th>
                <th>时间</th>
              </tr>
            </thead>
            <tbody id="replyTableBody"></tbody>
          </table>
        </div>
        <div class="tab-pane fade" id="messages">
          <ul class="list-group" id="messageList"></ul>
        </div>
        <div class="tab-pane fade" id="profile">
          <h5>修改昵称</h5>
          <input
            type="text"
            class="form-control mb-2"
            id="newNickname"
            placeholder="新昵称"
          />
          <button class="btn btn-secondary" id="saveNickname">保存</button>
          <hr />
          <h5>修改密码</h5>
          <input
            type="text"
            class="form-control mb-2"
            id="secAnswer"
            placeholder="密保答案"
          />
          <input
            type="password"
            class="form-control mb-2"
            id="newPwd"
            placeholder="新密码（6-12）"
          />
          <button class="btn btn-warning" id="changePwd">修改密码</button>
        </div>
      </div>
    </div>

    <!-- 审核留言模态框 -->
    <div class="modal fade" id="replyModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5>审核留言</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="replyModalBody"></div>
        </div>
      </div>
    </div>

    <script>
      // 原有加载逻辑不变（loadQuestions, loadReplies 等）
      async function loadQuestions() {
        const res = await api("/api/user/questions");
        if (res.code === 200) {
          const tbody = document.getElementById("questionTableBody");
          tbody.innerHTML = res.data.list
            .map(
              (q) => `
          <tr>
            <td>${q.title}</td>
            <td>${q.bounty}</td>
            <td>${new Date(q.created_at).toLocaleString()}</td>
            <td>
              <button class="btn btn-sm btn-info" onclick="viewReplies(${q.id})">审核留言</button>
              <a class="btn btn-sm btn-primary" href="/post-detail.html?id=${q.id}">查看</a>
            </td>
          </tr>
        `,
            )
            .join("");
        }
      }

      window.viewReplies = async (postId) => {
        const res = await api(`/api/user/questions/${postId}/replies`);
        if (res.code === 200) {
          let html = "";
          res.data.forEach((r) => {
            html += `<div class="border p-2 mb-2">
            <strong>${r.nickname}</strong> (${new Date(r.created_at).toLocaleString()}): 
            <p>${r.content}</p>
            ${
              r.is_approved_by_owner
                ? '<span class="badge bg-success">已审核</span>'
                : `<button class="btn btn-sm btn-success" onclick="approveReply(${postId},${r.id})">审核通过</button>
               <button class="btn btn-sm btn-danger" onclick="deleteReply(${postId},${r.id})">删除</button>
               <button class="btn btn-sm btn-warning" onclick="setBest(${postId},${r.id})">设为最佳</button>`
            }
          </div>`;
          });
          document.getElementById("replyModalBody").innerHTML =
            html || "暂无留言";
          new bootstrap.Modal(document.getElementById("replyModal")).show();
        }
      };

      window.approveReply = async (postId, replyId) => {
        await api(`/api/user/questions/${postId}/replies/${replyId}/approve`, {
          method: "PUT",
        });
        viewReplies(postId);
      };
      window.deleteReply = async (postId, replyId) => {
        if (await ModalAlert.confirm("确认删除", "确定要删除该回复吗？")) {
          await api(`/api/user/questions/${postId}/replies/${replyId}`, {
            method: "DELETE",
          });
          viewReplies(postId);
        }
      };
      window.setBest = async (postId, replyId) => {
        if (
          await ModalAlert.confirm(
            "设为最佳",
            "设为最佳答案后悬赏积分将转给回答者，确定吗？",
          )
        ) {
          const res = await api(
            `/api/posts/${postId}/replies/${replyId}/best`,
            { method: "PUT" },
          );
          if (res.code === 200) ModalAlert.success("已设为最佳");
          viewReplies(postId);
        }
      };

      async function loadReplies() {
        const res = await api("/api/user/replies");
        if (res.code === 200) {
          document.getElementById("replyTableBody").innerHTML = res.data
            .map(
              (r) => `
          <tr>
            <td>${r.content.substring(0, 50)}</td>
            <td><a href="/post-detail.html?id=${r.post_id}">${r.title}</a></td>
            <td>${new Date(r.created_at).toLocaleString()}</td>
          </tr>
        `,
            )
            .join("");
        }
      }

      async function loadMessages() {
        const res = await api("/api/user/messages");
        if (res.code === 200) {
          document.getElementById("messageList").innerHTML = res.data
            .map(
              (m) => `
          <li class="list-group-item">
            <strong>${m.from_admin || "系统"}</strong>: ${m.content}
            <small class="text-muted float-end">${new Date(m.created_at).toLocaleString()}</small>
          </li>
        `,
            )
            .join("");
        }
      }

      document
        .getElementById("saveNickname")
        .addEventListener("click", async () => {
          const nickname = document.getElementById("newNickname").value;
          const res = await api("/api/user/profile", {
            method: "PUT",
            body: JSON.stringify({ nickname }),
          });
          ModalAlert.success(res.msg);
        });
      document
        .getElementById("changePwd")
        .addEventListener("click", async () => {
          const security_answer = document.getElementById("secAnswer").value;
          const new_password = document.getElementById("newPwd").value;
          const res = await api("/api/user/change-password", {
            method: "PUT",
            body: JSON.stringify({ security_answer, new_password }),
          });
          ModalAlert.success(res.msg);
        });

      // 初始化
      loadQuestions();
      document
        .getElementById("myReplies")
        .addEventListener("show.bs.tab", loadReplies);
      document
        .getElementById("messages")
        .addEventListener("show.bs.tab", loadMessages);
    </script>
  </body>
</html>
