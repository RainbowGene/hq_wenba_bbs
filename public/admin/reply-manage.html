<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>回复留言管理 - 问吧</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
  </head>
  <body>
    <div class="p-4">
      <h3>回复留言管理</h3>
      <!-- 搜索区 -->
      <div class="row mb-3 g-2">
        <div class="col-md-3">
          <input
            type="text"
            class="form-control"
            id="searchPostId"
            placeholder="问题ID"
          />
        </div>
        <div class="col-md-3">
          <input
            type="text"
            class="form-control"
            id="searchUserId"
            placeholder="发布人ID"
          />
        </div>
        <div class="col-md-3">
          <input
            type="text"
            class="form-control"
            id="searchContent"
            placeholder="内容关键字"
          />
        </div>
        <div class="col-md-2">
          <button class="btn btn-primary w-100" onclick="searchReplies()">
            搜索
          </button>
        </div>
      </div>

      <!-- 批量操作 -->
      <div class="btn-group mb-3">
        <button class="btn btn-outline-danger btn-sm" onclick="batchDelete()">
          批量删除
        </button>
        <button class="btn btn-outline-secondary btn-sm" onclick="batchBlock()">
          批量屏蔽
        </button>
      </div>

      <table class="table table-bordered table-hover" id="replyTable">
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAll" /></th>
            <th>回复ID</th>
            <th>发布人工号</th>
            <th>用户ID</th>
            <th>问题ID</th>
            <th>回复内容</th>
            <th>贴主审核</th>
            <th>屏蔽状态</th>
            <th>回复时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="replyTableBody"></tbody>
      </table>
      <div id="paginationContainer"></div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/modal-alert.js"></script>
    <script src="/js/common.js"></script>
    <script>
      let currentPage = 1;
      const pageSize = 15;
      let currentFilters = {};

      async function loadReplies(page = 1, filters = {}) {
        currentPage = page;
        currentFilters = filters;
        const params = new URLSearchParams({
          page,
          size: pageSize,
          ...filters,
        });
        const res = await api(`/api/admin/replies?${params}`);
        if (res.code !== 200) {
          ModalAlert.error(res.msg || "加载失败");
          return;
        }
        const { list, total } = res.data;
        const tbody = document.getElementById("replyTableBody");
        if (list.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="10" class="text-center">暂无数据</td></tr>';
          return;
        }
        tbody.innerHTML = list
          .map(
            (r) => `
    <tr>
      <td><input type="checkbox" value="${r.id}" class="rowCheck"></td>
      <td>${r.id}</td>
      <td>${r.username}</td>
      <td>${r.user_id}</td>
      <td>${r.post_id}</td>
      <td>${r.content}</td>
      <td>${r.is_approved_by_owner ? "已审核" : "未审核"}</td>
      <td>${r.is_blocked ? '<span class="badge bg-danger">已屏蔽</span>' : "正常"}</td>
      <td>${new Date(r.created_at).toLocaleString()}</td>
      <td>
        <button class="btn btn-sm btn-danger" onclick="deleteReply(${r.id})">删除</button>
        <button class="btn btn-sm btn-secondary" onclick="blockReply(${r.id})">${r.is_blocked ? "取消屏蔽" : "屏蔽"}</button>
      </td>
    </tr>
  `,
          )
          .join("");
        renderPagination(
          document.getElementById("paginationContainer"),
          page,
          total,
          pageSize,
          (p) => loadReplies(p, filters),
        );
      }

      function searchReplies() {
        const filters = {
          post_id: document.getElementById("searchPostId").value.trim(),
          user_id: document.getElementById("searchUserId").value.trim(),
          content: document.getElementById("searchContent").value.trim(),
        };
        Object.keys(filters).forEach((k) => {
          if (!filters[k]) delete filters[k];
        });
        loadReplies(1, filters);
      }

      document.getElementById("selectAll").onclick = function () {
        document
          .querySelectorAll(".rowCheck")
          .forEach((cb) => (cb.checked = this.checked));
      };

      function getSelectedIds() {
        return [...document.querySelectorAll(".rowCheck:checked")].map((cb) =>
          parseInt(cb.value),
        );
      }

      async function batchDelete() {
        const ids = getSelectedIds();
        if (!ids.length) return ModalAlert.error("请选择回复");
        const confirmed = await ModalAlert.confirm(
          "确认删除",
          "确定要删除选中的回复吗？",
        );
        if (!confirmed) return;
        await api("/api/admin/replies/delete", {
          method: "DELETE",
          body: JSON.stringify({ ids }),
        });
        loadReplies(currentPage, currentFilters);
      }

      async function batchBlock() {
        const ids = getSelectedIds();
        if (!ids.length) return ModalAlert.error("请选择回复");
        const confirmed = await ModalAlert.confirm(
          "确认操作",
          "确定要切换选中回复的屏蔽状态吗？",
        );
        if (!confirmed) return;
        await api("/api/admin/replies/block", {
          method: "PUT",
          body: JSON.stringify({ ids }),
        });
        loadReplies(currentPage, currentFilters);
      }

      async function deleteReply(id) {
        const confirmed = await ModalAlert.confirm(
          "确认删除",
          "确定要删除该回复吗？",
        );
        if (!confirmed) return;
        await api("/api/admin/replies/delete", {
          method: "DELETE",
          body: JSON.stringify({ ids: [id] }),
        });
        loadReplies(currentPage, currentFilters);
      }

      async function blockReply(id) {
        await api("/api/admin/replies/block", {
          method: "PUT",
          body: JSON.stringify({ ids: [id] }),
        });
        loadReplies(currentPage, currentFilters);
      }

      loadReplies(1);
    </script>
  </body>
</html>
