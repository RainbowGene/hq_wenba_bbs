<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>管理员操作日志 - 问吧</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
  </head>
  <body>
    <div class="d-flex">
      <div class="flex-grow-1 p-4">
        <h3>管理员操作日志</h3>
        <div class="row mb-3">
          <div class="col-md-3">
            <input
              type="text"
              class="form-control"
              id="searchAdmin"
              placeholder="管理员昵称/工号"
            />
          </div>
          <div class="col-md-3">
            <input
              type="text"
              class="form-control"
              id="searchAction"
              placeholder="操作类型"
            />
          </div>
          <div class="col-md-2">
            <input type="date" class="form-control" id="searchDate" />
          </div>
          <div class="col-md-2">
            <button class="btn btn-primary" onclick="searchLogs()">搜索</button>
          </div>
        </div>
        <table class="table table-bordered table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>管理员昵称</th>
              <th>工号</th>
              <th>操作</th>
              <th>目标类型</th>
              <th>目标ID</th>
              <th>详情</th>
              <th>操作时间</th>
            </tr>
          </thead>
          <tbody id="logsTableBody"></tbody>
        </table>
        <div id="paginationContainer"></div>
      </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script>
      let currentPage = 1;
      const pageSize = 20;

      async function loadLogs(page = 1, filters = {}) {
        currentPage = page;
        const params = new URLSearchParams({
          page,
          size: pageSize,
          ...filters,
        });
        const res = await api(`/api/admin/admin-logs?${params}`);
        if (res.code !== 200) return alert(res.msg);
        const { list, total } = res.data;
        const tbody = document.getElementById("logsTableBody");
        tbody.innerHTML =
          list
            .map(
              (log) => `
    <tr>
      <td>${log.id}</td>
      <td>${log.admin_nickname}</td>
      <td>${log.employee_id || "-"}</td>
      <td>${log.action}</td>
      <td>${log.target_type || "-"}</td>
      <td>${log.target_id || "-"}</td>
      <td>${log.detail || "-"}</td>
      <td>${new Date(log.created_at).toLocaleString()}</td>
    </tr>
  `,
            )
            .join("") ||
          '<tr><td colspan="8" class="text-center">暂无操作记录</td></tr>';
        renderPagination(
          document.getElementById("paginationContainer"),
          page,
          total,
          pageSize,
          (p) => loadLogs(p, filters),
        );
      }

      function searchLogs() {
        const filters = {
          admin: document.getElementById("searchAdmin").value.trim(),
          action: document.getElementById("searchAction").value.trim(),
          date: document.getElementById("searchDate").value,
        };
        Object.keys(filters).forEach((k) => {
          if (!filters[k]) delete filters[k];
        });
        loadLogs(1, filters);
      }

      loadLogs();
    </script>
  </body>
</html>
