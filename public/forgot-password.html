<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>找回密码 - 问吧</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
  </head>
  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div id="step1">
            <h4>找回密码 - 验证身份</h4>
            <div class="mb-3">
              <label class="form-label">账号</label>
              <input
                type="text"
                class="form-control"
                id="username"
                placeholder="请输入账号"
              />
            </div>
            <div class="mb-3">
              <label class="form-label">密保问题</label>
              <input
                type="text"
                class="form-control"
                value="身份证后6位"
                readonly
              />
            </div>
            <div class="mb-3">
              <label class="form-label">密保答案（身份证后6位）</label>
              <input
                type="text"
                class="form-control"
                id="security_answer"
                placeholder="请输入身份证后6位"
                required
                maxlength="6"
              />
            </div>
            <button class="btn btn-primary" id="verifyBtn">验证</button>
          </div>
          <div id="step2" style="display: none">
            <h4>设置新密码</h4>
            <div class="mb-3">
              <input
                type="password"
                class="form-control"
                id="newPassword"
                placeholder="新密码（6-12字符）"
                required
              />
            </div>
            <button class="btn btn-success" id="resetBtn">重置密码</button>
          </div>
          <div class="mt-3"><a href="/login.html">返回登录</a></div>
        </div>
      </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/modal-alert.js"></script>
    <script src="/js/common.js"></script>
    <script>
      let resetToken = "";
      document
        .getElementById("verifyBtn")
        .addEventListener("click", async () => {
          const username = document.getElementById("username").value.trim();
          const security_answer = document
            .getElementById("security_answer")
            .value.trim();
          if (!username || !security_answer) {
            ModalAlert.error("请填写账号和密保答案");
            return;
          }
          const res = await api("/api/auth/forgot-password/verify", {
            method: "POST",
            body: JSON.stringify({ username, security_answer }),
          });
          if (res.code === 200) {
            resetToken = res.data.resetToken;
            document.getElementById("step1").style.display = "none";
            document.getElementById("step2").style.display = "block";
          } else {
            ModalAlert.error(res.msg);
          }
        });

      document
        .getElementById("resetBtn")
        .addEventListener("click", async () => {
          const newPassword = document.getElementById("newPassword").value;
          if (newPassword.length < 6 || newPassword.length > 12) {
            ModalAlert.error("密码长度6-12字符");
            return;
          }
          const res = await api("/api/auth/forgot-password/reset", {
            method: "POST",
            body: JSON.stringify({ resetToken, newPassword }),
          });
          if (res.code === 200) {
            ModalAlert.success("密码重置成功，请登录");
            window.location.href = "/login.html";
          } else {
            ModalAlert.error(res.msg);
          }
        });
    </script>
  </body>
</html>
