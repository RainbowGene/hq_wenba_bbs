<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>找回密码 - 问吧</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
  </head>
  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <!-- 步骤1：验证密保 -->
          <div id="step1">
            <h4>找回密码 - 验证密保</h4>
            <div class="mb-3">
              <input
                type="text"
                class="form-control"
                id="username"
                placeholder="账号"
              />
            </div>
            <div class="mb-3">
              <input
                type="text"
                class="form-control"
                id="security_question"
                placeholder="密保问题"
              />
            </div>
            <div class="mb-3">
              <input
                type="text"
                class="form-control"
                id="security_answer"
                placeholder="密保答案"
              />
            </div>
            <button class="btn btn-primary" id="verifyBtn">验证</button>
          </div>
          <!-- 步骤2：重置密码（初始隐藏） -->
          <div id="step2" style="display: none">
            <h4>设置新密码</h4>
            <input
              type="password"
              class="form-control mb-2"
              id="newPassword"
              placeholder="新密码（6-12字符）"
            />
            <button class="btn btn-success" id="resetBtn">重置密码</button>
          </div>
          <div class="mt-3"><a href="/login.html">返回登录</a></div>
        </div>
      </div>
    </div>
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script>
      let resetToken = "";
      document
        .getElementById("verifyBtn")
        .addEventListener("click", async () => {
          const username = document.getElementById("username").value;
          const security_question =
            document.getElementById("security_question").value;
          const security_answer =
            document.getElementById("security_answer").value;
          const res = await api("/api/auth/forgot-password/verify", {
            method: "POST",
            body: JSON.stringify({
              username,
              security_question,
              security_answer,
            }),
          });
          if (res.code === 200) {
            resetToken = res.data.resetToken;
            document.getElementById("step1").style.display = "none";
            document.getElementById("step2").style.display = "block";
          } else {
            alert(res.msg);
          }
        });
      document
        .getElementById("resetBtn")
        .addEventListener("click", async () => {
          const newPassword = document.getElementById("newPassword").value;
          if (newPassword.length < 6 || newPassword.length > 12)
            return alert("密码长度6-12字符");
          const res = await api("/api/auth/forgot-password/reset", {
            method: "POST",
            body: JSON.stringify({ resetToken, newPassword }),
          });
          if (res.code === 200) {
            alert("密码重置成功，请登录");
            window.location.href = "/login.html";
          } else {
            alert(res.msg);
          }
        });
    </script>
  </body>
</html>
