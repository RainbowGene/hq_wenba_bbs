<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - 问吧</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <style>
      body,
      html {
        height: 100%;
        background: #f5f7fa;
      }
      .login-wrapper {
        display: flex;
        height: 100vh;
        align-items: center;
        justify-content: center;
      }
      .login-card {
        display: flex;
        width: 800px;
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      }
      .poster {
        flex: 1;
        background: linear-gradient(135deg, #0d6efd, #6610f2);
        color: #fff;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .poster h2 {
        font-weight: 700;
      }
      .poster p {
        opacity: 0.9;
        margin-top: 10px;
      }
      .form-section {
        flex: 1;
        padding: 40px;
      }
      .captcha-box {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .captcha-box img {
        cursor: pointer;
        border: 1px solid #ddd;
        border-radius: 4px;
        height: 38px;
      }
      .form-check {
        margin: 12px 0;
      }
    </style>
  </head>
  <body>
    <div class="login-wrapper">
      <div class="login-card">
        <!-- 左侧海报 -->
        <div class="poster">
          <h2>问吧</h2>
          <p>集团内网知识共享平台<br />提问、解答、分享</p>
          <small class="mt-3">有问题，就有答案</small>
        </div>
        <!-- 右侧登录表单 -->
        <div class="form-section">
          <h4 class="mb-3">员工登录</h4>
          <form id="loginForm">
            <div class="mb-3">
              <input
                type="text"
                class="form-control"
                name="username"
                placeholder="账号 (1大写字母+7位数字)"
                required
              />
            </div>
            <div class="mb-3">
              <input
                type="password"
                class="form-control"
                name="password"
                placeholder="密码"
                required
              />
            </div>
            <div class="mb-3 captcha-box">
              <input
                type="text"
                class="form-control"
                name="captchaInput"
                placeholder="验证码"
                required
                maxlength="4"
              />
              <img
                id="captchaImage"
                src=""
                alt="验证码"
                title="点击刷新"
                style="width: 100px"
              />
            </div>
            <div class="form-check">
              <input
                type="checkbox"
                class="form-check-input"
                id="rememberMe"
                name="rememberMe"
              />
              <label class="form-check-label" for="rememberMe"
                >7天内免登录</label
              >
            </div>
            <button type="submit" class="btn btn-primary w-100">登 录</button>
          </form>
          <div class="mt-3 text-center">
            <a href="/register.html">注册新用户</a> |
            <a href="/forgot-password.html">忘记密码？</a>
          </div>
        </div>
      </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script>
      let captchaToken = "";

      // 刷新验证码
      async function refreshCaptcha() {
        try {
          const res = await api("/api/auth/captcha");
          if (res.code === 200) {
            captchaToken = res.data.captchaToken;
            const svgData = res.data.svg;
            // 将 SVG 转为 data URI
            const svgBlob = new Blob([svgData], { type: "image/svg+xml" });
            const url = URL.createObjectURL(svgBlob);
            document.getElementById("captchaImage").src = url;
          }
        } catch (e) {
          console.error("获取验证码失败", e);
        }
      }
      refreshCaptcha();
      document
        .getElementById("captchaImage")
        .addEventListener("click", refreshCaptcha);

      // 提交登录
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const form = e.target;
          const formData = new FormData(form);
          const data = Object.fromEntries(formData);
          data.rememberMe = form.querySelector("#rememberMe").checked; // 转换布尔值
          if (!captchaToken) return alert("验证码未加载，请刷新重试");
          data.captchaToken = captchaToken;

          const res = await api("/api/auth/login", {
            method: "POST",
            body: JSON.stringify(data),
          });
          if (res.code === 200) {
            localStorage.setItem("token", res.data.token);
            localStorage.setItem("user", JSON.stringify(res.data.user));
            // 7天免登录：将token有效期告知前端（可由后端返回，这里简单处理）
            if (data.rememberMe) {
              // 设置一个标记，用于后续自动登录（实际token已在localStorage，过期时间由JWT控制）
              localStorage.setItem("rememberMe", "true");
            }
            window.location.href = "/";
          } else {
            alert(res.msg);
            refreshCaptcha(); // 登录失败刷新验证码
          }
        });
    </script>
  </body>
</html>
